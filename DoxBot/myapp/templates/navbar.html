<!-- myapp/templates/myapp/navbar.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyApp</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0; 
            background-color: #eeeeee;
        }
        .navbar {
            display: flex; /* Enables Flexbox */
            background-color: #3358ff;
            width: 100%; /* Full width */
            height: 60px;
            justify-content: space-between; /* Space between the two sections */
            align-items: center; /* Center items vertically */
            position: fixed; /* Sticks navbar at the top */
            top: 0;
            left: 0;
            z-index: 1000;
            padding: 0 20px; /* Adds padding to the navbar */
            box-sizing: border-box;
        }
        .navbar-logo {
            font-weight: bolder;
            color: #f2f2f2;
            text-decoration: none;
            font-size: 18px;
        }
        .navbar-links {
            display: flex; /* Makes the links a horizontal row */
            gap: 10px; /* Adds spacing between links */
        }
        .navbar a {
            color: #f2f2f2;
            text-align: center;
            padding: 14px 20px;
            text-decoration: none;
            font-size: 16px;
        }
        .navbar a:hover {
            background-color: #dddddd25;
            border-radius: 8px;
        }
        .navbar .date {
            color: #f2f2f295;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="navbar">
        <div>
            <a href="{% url 'homepage' %}" class="navbar-logo">DoxBot</a>
            <span class="date">{{ current_date }}</span>
        </div>
        <div class="navbar-links">
            <a href="{% url 'check_firebase_and_send_email' %}">Audit</a>
            <a href="{% url 'notifications' %}">Notifications</a>
            <a href="{% url 'logs' %}">Logs</a>
            <a href="{% url 'app_usage_monitoring' %}">Activity</a>            
            <a href="{% url 'join' %}">Join</a>  
        </div>
    </div>
    <div><h1></h1></div>
</body>
</html>
