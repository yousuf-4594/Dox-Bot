<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App Usage Monitoring</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f4f4f4;
        }
        
        .container {
            max-width: 800px;
            margin: auto;
            padding: 20px;
            background-color: #fff;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            margin-top: 100px;
        }

        h2 {
            color: #333;
        }

        .form-group {
            margin-bottom: 1rem;
        }

        .form-control {
            width: 300px;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            margin-top: 5px;
        }

        .btn-primary {
            background-color: #007bff;
            color: white;
            padding: 8px 16px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        .btn-primary:hover {
            background-color: #0056b3;
        }

        .mb-4 {
            margin-bottom: 1.5rem;
        }

        .mt-4 {
            margin-top: 1.5rem;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }

        th {
            background-color: #f8f9fa;
        }

        tr:hover {
            background-color: #f5f5f5;
        }

        .alert {
            padding: 15px;
            margin-top: 20px;
            border-radius: 4px;
        }

        .alert-info {
            background-color: #cce5ff;
            border: 1px solid #b8daff;
            color: #004085;
        }
    </style>
</head>
<body>
    {% include 'navbar.html' %}
    
    <div class="container">
        <h2>App Usage Monitoring</h2>
        
        <form method="POST" class="mb-4">
            {% csrf_token %}
            <div class="form-group">
                <label for="device">Select Device:</label>
                <select name="device" id="device" class="form-control" required>
                    <option value="" {% if not selected_device %}selected{% endif %}>-- Select Device --</option>
                    {% for device in collection_names %}
                        <option value="{{ device }}" {% if device == selected_device %}selected{% endif %}>
                            {{ device }}
                        </option>
                    {% endfor %}
                </select>
            </div>
            
            <div class="form-group">
                <label for="date">Select Date:</label>
                <input type="date" name="date" id="date" class="form-control" 
                       value="{{ selected_date }}" required>
            </div>
            
            <button type="submit" class="btn btn-primary">View Usage Data</button>
        </form>

        {% if duration_per_app %}
            <h2>App Usage Data for {{ selected_device }} on {{ selected_date }}</h2>
            <table>
                <thead>
                    <tr>
                        <th>App</th>
                        <th>Total Duration (minutes)</th>
                    </tr>
                </thead>
                <tbody>
                    {% for row in duration_per_app %}
                    <tr>
                        <td>{{ row.App }}</td>
                        <td>{{ row.Duration_minutes }}</td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        {% endif %}
    </div>
</body>
</html>
