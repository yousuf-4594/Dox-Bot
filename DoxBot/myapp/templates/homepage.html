<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Homepage</title>
    <style>
        .container {
            max-width: 900px;
            margin: auto;
            padding: 20px;
            background-color: #f9f9f9;
            border-radius: 4px;
            box-shadow: 0 0 5px rgba(0, 0, 0, 0.1);
            margin-top: 100px;
        }
        h1 {
            color: #333;
        }
        .device-list {
            list-style:none;
            padding: 0;
            margin-top: 30px;
        }

        .device-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;            
            padding: 15px;
            border-top: 1px solid #e0e0e0;
            border-bottom: 1px solid #e0e0e0;
        }
    </style>
</head>
<body>
    {% include 'navbar.html' %}
    <!-- Main Content -->
    <div class="container">
        <div>
            <h2>Sources Status Table</h2>
            <span>A table that tracks the status of NameNodes to check if they are currently alive.</span>
        </div>
        <ul class="device-list">
            {% for device, info in devices.items %}
            <li class="device-item">
                <span style="font-weight: bolder;">{{ info.device_name }}</span>
                <div>
                    <span>{{ info.last_seen }}</span>
                    <span style="background-color: rgba(159, 181, 255, 0.222); padding: 5px; border-radius: 3px">{{ info.relative_time }} ago</span>
                </div>
            </li>
            {% endfor %}
        </ul>
        
    </div>
</body>
</html>
